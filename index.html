  function clone(value) { return JSON.parse(JSON.stringify(value)); }
  function createState() { return { projects: clone(seedProjects), currentProjectId: 'p3', activeView: 'home', activeProjectTab: 'overview', theme: 'light', activity: [] }; }
  function getProject(state, id) { return state.projects.find(p => p.id === (id || state.currentProjectId)); }
  function money(n) { return new Intl.NumberFormat('he-IL', { style: 'currency', currency: 'ILS', maximumFractionDigits: 0 }).format(Number(n) || 0); }
  function margin(project) { return project.contract ? Math.round(((project.contract - project.cost) / project.contract) * 100) : 0; }
  function balance(project) { return Math.max(0, project.contract - project.paid); }
  function totals(state) {
    const contract = state.projects.reduce((s, p) => s + p.contract, 0);
    const cost = state.projects.reduce((s, p) => s + p.cost, 0);
    const paid = state.projects.reduce((s, p) => s + p.paid, 0);
    const alerts = state.projects.reduce((s, p) => s + p.alerts.length, 0);
    return { contract, cost, paid, profit: contract - cost, alerts, openTasks: state.projects.reduce((s, p) => s + p.tasks.filter(t => !t.done).length, 0) };
  }
  function allAlerts(state) { return state.projects.flatMap(p => p.alerts.map(a => ({ ...a, projectId: p.id, projectName: p.name }))); }
  function parseUpdate(text) {
    const raw = String(text || '').trim();
    const lower = raw.toLowerCase();
    const nums = raw.match(/\d[\d,]*/g) || [];
    const hasAmbiguity = /לא ברור|אולי|\?|או\s+\d/.test(raw);
    const costMatch = raw.match(/(?:קנינו|עלות|עלה|הוצאה|ב־|ב)\s*(\d[\d,]*)\s*(?:שח|₪)?/);
    const crew = ['שחף', 'כפרי', 'דור', 'סהר', 'רון', 'חנן', 'ניר', 'עפרי'].filter(n => raw.includes(n));
    const shortages = /חסר|חסרים|להזמין/.test(lower) ? [raw.split(/[,.]/).find(x => /חסר|להזמין/.test(x))?.trim() || 'חוסר שזוהה'] : [];
    const extras = /תוספת|לא בהצעה/.test(lower) ? [raw] : [];
    const activities = raw.split(/[,.]/).map(x => x.trim()).filter(x => x.length > 2 && !/חסר|קנינו|עלות|הוצאה/.test(x)).slice(0, 3);
    return { raw, crew, numbers: nums, cost: costMatch ? Number(costMatch[1].replace(/,/g, '')) : 0, shortages, extras, activities, ambiguous: hasAmbiguity };
  }
  function applyUpdate(state, projectId, text) {
    const project = getProject(state, projectId);
    if (!project) return { ok: false, error: 'project_not_found' };
    const parsed = parseUpdate(text);
    if (!parsed.raw) return { ok: false, error: 'empty_update' };
    if (parsed.ambiguous) return { ok: false, needsClarification: true, parsed, question: 'זיהיתי סכום או ניסוח לא ודאי. איזה סכום נכון לעדכון?' };
    const title = parsed.activities.join(', ') || 'עדכון מהשטח';
    project.worklog.unshift({ date: 'היום', title, crew: parsed.crew.length ? parsed.crew.join(', ') : 'לא צוין', source: 'הקלטה חדשה', cost: parsed.cost });
    project.updates += 1;
    project.lastUpdate = 'היום';
    if (parsed.cost) {
      project.cost += parsed.cost;
      project.costs.unshift({ name: title.slice(0, 34), category: 'עדכון מהשטח', amount: parsed.cost, status: 'דווח', date: 'היום' });
    }
    parsed.shortages.forEach((s, i) => project.tasks.unshift({ title: s.replace(/^.*?(חסר(?:ים)?|להזמין)\s*/,'').trim() || 'חוסר חדש', type: 'חוסר', priority: i ? 'medium' : 'high', done: false }));
    project.progress = Math.min(99, project.progress + 1);
    state.activity.unshift({ projectId: project.id, text: parsed.raw, at: new Date().toISOString() });
    return { ok: true, parsed, project };
  }
  function resolveAlert(state, projectId, alertId) {
    const p = getProject(state, projectId); if (!p) return false;
    const before = p.alerts.length; p.alerts = p.alerts.filter(a => a.id !== alertId); return p.alerts.length < before;
  }
  function answerAgent(state, question) {
    const q = String(question || '').trim().toLowerCase();
    const p = getProject(state);
    const t = totals(state);
    if (!q) return 'אפשר לשאול על עלויות, יתרות, חריגות, חוסרים, עובדים או מצב פרויקט.';
    if (/מה.*דורש|חריג|התראה|לטפל/.test(q)) {
      const alerts = allAlerts(state).slice(0, 4);
      return alerts.length ? `יש ${t.alerts} חריגות פעילות. המרכזיות: ${alerts.map(a => `${a.projectName} — ${a.title}`).join('; ')}.` : 'לא נמצאו חריגות פעילות בנתוני הדמו.';
    }
    if (/רווח|רווחיות|מרווח/.test(q)) {
      if (/כל|עסק|חברה/.test(q)) return `הרווח התפעולי החזוי בכל הפרויקטים הוא ${money(t.profit)} מתוך היקף הצעות של ${money(t.contract)}.`;
      return `ב${p.name} העלות המצטברת היא ${money(p.cost)} מול הצעה של ${money(p.contract)}. הרווח התפעולי החזוי הוא ${money(p.contract - p.cost)} (${margin(p)}%).`;
    }
    if (/יתרה|לגבייה|שולם|תשלום/.test(q)) return `ב${p.name} התקבלו ${money(p.paid)} ונשארו ${money(balance(p))} לפי בסיס ההצעה הנוכחי. קיימת התראה אם בסיס החישוב אינו עקבי.`;
    if (/חסר|הזמנ|משימ/.test(q)) {
      const open = p.tasks.filter(x => !x.done);
      return open.length ? `ב${p.name} יש ${open.length} פריטים פתוחים: ${open.map(x => x.title).join(', ')}.` : `לא נמצאו חוסרים או משימות פתוחות ב${p.name}.`;
    }
    if (/עובד|יומיות|צוות/.test(q)) return `ב${p.name} תועדו ${p.crewDays} יומיות/ימי צוות ועלות עבודה של ${money(p.labor)}.`;
    const mentioned = state.projects.find(x => q.includes(x.name.replace('גינת ', '').toLowerCase()) || q.includes(x.location.toLowerCase()));
    if (mentioned) return `${mentioned.name} נמצא בשלב ${mentioned.stage}, ${mentioned.progress}% התקדמות, עלות ${money(mentioned.cost)}, ו־${mentioned.alerts.length} חריגות פעילות.`;
    if (/פרויקט|מצב/.test(q)) return `${p.name} נמצא בשלב ${p.stage} וב־${p.progress}% התקדמות. העדכון האחרון: ${p.lastUpdate}.`;
    return 'לא מצאתי תשובה מבוססת בנתוני הדמו. אפשר לשאול למשל: “מה דורש טיפול?”, “מה הרווחיות?”, “מה חסר בפרויקט?” או “כמה נשאר לגבייה?”.';
  }
  return { seedProjects, createState, getProject, money, margin, balance, totals, allAlerts, parseUpdate, applyUpdate, resolveAlert, answerAgent };
});
</script>
<script>

  function toast(msg){ $('#toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`; setTimeout(()=>$('#toastRoot').innerHTML='',2600); }

  function projectRow(p){ return `<div class="project-row" data-project="${p.id}" role="button" tabindex="0"><div><div class="project-name">${esc(p.name)}</div><span class="tiny muted">${esc(p.location)} · ${esc(p.stage)}</span><div class="progress"><i style="width:${p.progress}%"></i></div></div><div><span class="tiny muted">עלות מצטברת</span><div class="money">${C.money(p.cost)}</div></div><div><span class="tiny muted">רווחיות חזויה</span><div class="money">${C.margin(p)}%</div></div><button class="row-action" aria-label="פתיחת פרויקט">←</button></div>`; }
  function alertCard(a){ return `<div class="alert" data-project="${a.projectId}" data-target="${a.target}"><span class="alert-dot ${a.severity}"></span><div><strong>${esc(a.title)}</strong><p>${esc(a.projectName)} · ${esc(a.detail)}</p><div class="linkish">פתיחה בפרויקט ←</div></div></div>`; }

iv>`; }
  function projects(){ return `<div class="pagehead"><div><h1>פרויקטים</h1><p>כל התיקים במקום אחד — פעילים, שהסתיימו וארכיון.</p></div><button class="primary" id="pageNewProject">＋ פתיחת פרויקט</button></div><div class="card"><div class="section-title"><h2>פעילים</h2><span class="badge">${state.projects.length} פרויקטים</span></div><div class="project-list">${state.projects.map(projectRow).join('')}</div></div><div class="card"><div class="section-title"><h2>הסתיימו לאחרונה</h2></div><div class="empty">אין פרויקטים שהסתיימו בנתוני הדמו.</div></div>`; }
  function insights(){ const t=C.totals(state), avg=Math.round(state.projects.reduce((s,p)=>s+C.margin(p),0)/state.projects.length); return `<div class="pagehead"><div><h1>תובנות עסקיות</h1><p>השוואות המבוססות על הנתונים שמארק כבר מזין תוך כדי העבודה.</p></div><span class="badge">נכון להיום</span></div><div class="metrics"><div class="metric m1"><div class="label">עלות כוללת</div><div class="value">${C.money(t.cost)}</div><div class="sub">עבודה וחומרים</div></div><div class="metric m2"><div class="label">נגבה עד כה</div><div class="value">${C.money(t.paid)}</div><div class="sub">ברמת הפרויקטים</div></div><div class="metric m3"><div class="label">משימות פתוחות</div><div class="value">${t.openTasks}</div><div class="sub">כולל חוסרים ותוספות</div></div><div class="metric m4"><div class="label">רווחיות ממוצעת</div><div class="value">${avg}%</div><div class="sub">תחזית תפעולית</div></div></div><div class="insight-grid"><div class="card insight"><div class="section-title"><h2>עלות לפי פרויקט</h2></div><div class="bars">${state.projects.map(p=>`<div class="bar" style="height:${Math.max(35,Math.round(p.cost/650))}px"><span>${esc(p.location)}</span></div>`).join('')}</div></div><div class="card insight"><div class="section-title"><h2>רווחיות ממוצעת</h2></div><div class="ring" style="--pct:${avg}%"><strong>${avg}%</strong></div></div><div class="card insight"><div class="section-title"><h2>תובנה מרכזית</h2><span class="badge warn">דורש החלטה</span></div><p><strong>תוספות שאינן מתומחרות</strong></p><p class="muted">בפרויקט כהן קיימות שתי עבודות שכבר בוצעו אך טרם תומחרו. טיפול עכשיו מונע אובדן הכנסה.</p><button class="secondary" data-open-alert="p2">פתיחה בפרויקט</button></div></div><div class="card"><div class="section-title"><h2>השוואת פרויקטים</h2></div><div class="tablewrap"><table><thead><tr><th>פרויקט</th><th>הצעה</th><th>עלות</th><th>רווח חזוי</th><th>יומיות</th><th>חריגות</th></tr></thead><tbody>${state.projects.map(p=>`<tr data-project="${p.id}"><td><strong>${esc(p.name)}</strong></td><td>${C.money(p.contract)}</td><td>${C.money(p.cost)}</td><td>${C.margin(p)}%</td><td>${p.crewDays}</td><td>${p.alerts.length}</td></tr>`).join('')}</tbody></table></div></div>`; }
  function projectHeader(p){ return `<div class="project-hero"><div class="breadcrumbs"><button class="secondary tiny" data-go="projects">פרויקטים</button> · ${esc(p.name)}</div><div class="hero-grid"><div class="hero-main"><h1>${esc(p.name)}</h1><div class="muted">${esc(p.location)} · ${esc(p.stage)} · עדכון אחרון ${esc(p.lastUpdate)}</div><div style="margin-top:8px">${p.tags.map(t=>`<span class="badge">${esc(t)}</span>`).join(' ')}</div></div><div class="hero-actions"><button class="primary" id="projectRecord">● הקלטת עדכון</button><button class="secondary" id="projectPhotos">▧ תמונות</button><button class="secondary" id="projectFile">⇧ מסמך</button></div></div></div><div class="project-tabs">${[['overview','תקציר'],['worklog','יומן עבודה'],['costs','עלויות ורווחיות'],['execution','ביצוע'],['files','קבצים ותמונות']].map(([id,l])=>`<button class="ptab ${state.activeProjectTab===id?'active':''}" data-ptab="${id}">${l}</button>`).join('')}</div>`; }
  function projectOverview(p){ return `<div class="kpi-strip"><div class="soft-kpi"><span>התקדמות</span><strong>${p.progress}%</strong><div class="progress"><i style="width:${p.progress}%"></i></div></div><div class="soft-kpi"><span>עלות מצטברת</span><strong>${C.money(p.cost)}</strong></div><div class="soft-kpi"><span>רווח חזוי</span><strong>${C.money(p.contract-p.cost)}</strong></div><div class="soft-kpi"><span>יתרה לגבייה</span><strong>${C.money(C.balance(p))}</strong></div></div><div class="grid2"><div><div class="card"><div class="section-title"><h2>מה קרה לאחרונה</h2><button class="secondary tiny" data-ptab="worklog">לכל היומן</button></div><div class="timeline">${p.worklog.slice(0,4).map(e=>`<div class="event"><strong>${esc(e.date)}</strong><span class="event-dot"></span><div><h3>${esc(e.title)}</h3><p>${esc(e.crew)} · ${esc(e.source)} ${e.cost?`· <span class="event-cost">${C.money(e.cost)}</span>`:''}</p></div></div>`).join('')}</div></div><div class="card"><div class="section-title"><h2>סיכום שבועי</h2><span class="badge">אוטומטי</span></div><p>${esc(p.weekly)}</p></div></div><div><div class="card"><div class="section-title"><h2>חריגות ותובנות</h2><span class="badge danger">${p.alerts.length}</span></div><div class="alert-list">${p.alerts.length?p.alerts.map(a=>alertCard({...a,projectId:p.id,projectName:p.name})).join(''):'<div class="empty">אין חריגות פעילות.</div>'}</div></div><div class="card"><div class="section-title"><h2>השלבים הבאים</h2></div>${p.tasks.filter(t=>!t.done).slice(0,4).map(taskRow).join('')}</div></div></div>`; }
  function taskRow(t,i){ return `<div class="task"><button class="check ${t.done?'done':''}" data-task="${i}" aria-label="סימון משימה">${t.done?'✓':''}</button><div class="task-main"><strong>${esc(t.title)}</strong><span class="tiny muted">${esc(t.type)}</span></div><span class="badge ${t.priority==='high'?'danger':t.priority==='medium'?'warn':''}">${t.priority==='high'?'דחוף':t.priority==='medium'?'בינוני':'רגיל'}</span></div>`; }
  function projectWorklog(p){ return `<div class="card"><div class="section-title"><h2>יומן עבודה</h2><button class="primary" id="logUpdate">＋ עדכון</button></div><div class="timeline">${p.worklog.map(e=>`<div class="event"><strong>${esc(e.date)}</strong><span class="event-dot"></span><div><h3>${esc(e.title)}</h3><p>${esc(e.crew)} · מקור: ${esc(e.source)} ${e.cost?`· <span class="event-cost">${C.money(e.cost)}</span>`:''}</p></div></div>`).join('')}</div></div>`; }
  function projectCosts(p){ return `<div class="metrics"><div class="metric m1"><div class="label">הצעה נטו</div><div class="value">${C.money(p.contract)}</div><div class="sub">הצעה מקורית ${C.money(p.originalContract)}</div></div><div class="metric m2"><div class="label">עלות בפועל</div><div class="value">${C.money(p.cost)}</div><div class="sub">נכון לעדכון האחרון</div></div><div class="metric m4"><div class="label">רווח חזוי</div><div class="value">${C.money(p.contract-p.cost)}</div><div class="sub">${C.margin(p)}% מההצעה</div></div><div class="metric m3"><div class="label">יתרה לגבייה</div><div class="value">${C.money(C.balance(p))}</div><div class="sub">נגבה ${C.money(p.paid)}</div></div></div><div class="card"><div class="section-title"><h2>פירוט עלויות</h2><span class="badge">תפעולי · לא הנהלת חשבונות</span></div><div class="tablewrap"><table><thead><tr><th>פריט</th><th>קטגוריה</th><th>סכום</th><th>סטטוס</th><th>תאריך</th></tr></thead><tbody>${p.costs.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.category)}</td><td>${C.money(c.amount)}</td><td><span class="badge ${c.status==='אחרי חתך'?'warn':'ok'}">${esc(c.status)}</span></td><td>${esc(c.date)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2">סה״כ מערכת</td><td>${C.money(p.cost)}</td><td colspan="2">רווח חזוי ${C.money(p.contract-p.cost)}</td></tr></tfoot></table></div></div>`; }
  function projectExecution(p){ return `<div class="grid2"><div class="card"><div class="section-title"><h2>משימות, חוסרים והזמנות</h2><span class="badge">${p.tasks.filter(t=>!t.done).length} פתוחים</span></div>${p.tasks.map(taskRow).join('')}</div><div class="card"><div class="section-title"><h2>תוספות ושינויים</h2></div>${p.alerts.filter(a=>/תוספת|מחיר/.test(a.title+a.detail)).map(a=>alertCard({...a,projectId:p.id,projectName:p.name})).join('')||'<div class="empty">אין תוספות פתוחות בפרויקט.</div>'}<button class="secondary" style="margin-top:12px" id="addExtra">＋ תוספת חדשה</button></div></div>`; }
  function projectFiles(p){ return `<div class="card"><div class="section-title"><h2>קבצים ותמונות</h2><div><button class="secondary" id="filesPhotos">▧ תמונות</button> <button class="primary" id="filesUpload">⇧ העלאה</button></div></div><div class="file-grid">${p.files.map(f=>`<div class="file"><div class="file-icon">${f.type==='תמונות'?'▧':f.type==='מקור'?'◉':'▤'}</div><strong>${esc(f.name)}</strong><span>${esc(f.type)} · ${esc(f.date)}</span></div>`).join('')}</div></div><div class="card"><div class="section-title"><h2>מקורות ושקיפות</h2><span class="badge ok">היסטוריה נשמרת</span></div><p class="muted">כל נתון שחולץ נשאר מקושר להקלטה, לפתק או למסמך המקורי. תיקון חדש יוצר גרסה ואינו מוחק את ההיסטוריה.</p></div>`; }
  function project(){ const p=C.getProject(state); const body=state.activeProjectTab==='overview'?projectOverview(p):state.activeProjectTab==='worklog'?projectWorklog(p):state.activeProjectTab==='costs'?projectCosts(p):state.activeProjectTab==='execution'?projectExecution(p):projectFiles(p); return projectHeader(p)+body; }
  function render(){ content.innerHTML=state.activeView==='home'?home():state.activeView==='projects'?projects():state.activeView==='insights'?insights():project(); bind(); }
  function openProject(id,tab='overview'){ state.currentProjectId=id; state.activeProjectTab=tab; state.activeView='project'; $$('.navbtn').forEach(b=>b.classList.remove('active')); render(); }
  function modal(inner){ overlay.innerHTML=`<div class="modalback"><div class="modal">${inner}</div></div>`; $('.modalback').addEventListener('click',e=>{if(e.target.classList.contains('modalback'))closeModal()}); $$('.close').forEach(b=>b.onclick=closeModal); }
  function closeModal(){overlay.innerHTML=''}
  function updateModal(projectId){ const p=projectId?C.getProject(state,projectId):null; modal(`<div class="modalhead"><div><h2>עדכון חדש</h2><p class="muted">${p?esc(p.name):'בחר פרויקט'}</p></div><button class="close">×</button></div>${p?'':`<div class="field"><label>פרויקט</label><select id="updateProject">${state.projects.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>`}<div class="recordbox"><button class="record" id="recordBtn">●</button><p><strong>לחץ להדגמת הקלטה</strong></p><span class="tiny muted">אפשר להקליט מספר עדכונים במהלך היום</span></div><div class="field"><label>תמלול / עדכון חופשי</label><textarea id="updateText" placeholder="למשל: היום שחף וכפרי השלימו טפטוף. קנינו קומפוסט ב־800 וחסרים שני מחברים."></textarea></div><div class="modal-actions"><button class="primary" id="processUpdate">שמירה ועיבוד</button><button class="secondary close">ביטול</button></div>`); let rec=false; $('#recordBtn').onclick=()=>{rec=!rec;$('#recordBtn').classList.toggle('recording',rec);$('#recordBtn').textContent=rec?'■':'●'; if(rec){setTimeout(()=>{const ta=$('#updateText'); if(ta){ta.value='היום שחף וכפרי השלימו טפטוף ושתלו עצים. קנינו קומפוסט ב־800 שקל וחסרים שני מחברי 16.';$('#recordBtn').classList.remove('recording');$('#recordBtn').textContent='✓';}},1100)}}; $('#processUpdate').onclick=()=>{const id=p?.id||$('#updateProject').value;const text=$('#updateText').value;const res=C.applyUpdate(state,id,text);if(res.needsClarification){clarifyModal(id,text)}else if(res.ok){closeModal();openProject(id,'overview');toast('העדכון עובד ונשמר בפרויקט')}else toast('יש להזין עדכון קצר')}; }
  function clarifyModal(id,text){ modal(`<div class="modalhead"><div><h2>רק שאלה אחת</h2><p class="muted">יתר העדכון ברור ויישמר אוטומטית.</p></div><button class="close">×</button></div><div class="card" style="margin-top:14px"><span class="badge warn">אי־בהירות כספית</span><h3>האם הסכום הוא 800 או 1,800 ₪?</h3><p class="muted">מקור: ${esc(text)}</p></div><div class="modal-actions"><button class="primary clarify" data-v="800">800 ₪</button><button class="secondary clarify" data-v="1800">1,800 ₪</button></div>`); $$('.clarify').forEach(b=>b.onclick=()=>{const fixed=text.replace(/\d[\d,]*(?=\s*(?:שקל|₪))/,b.dataset.v).replace(/[?]/g,'');C.applyUpdate(state,id,fixed);closeModal();openProject(id);toast('ההבהרה נשמרה והנתונים עודכנו')}); }
  function fileModal(kind='מסמך'){ const p=C.getProject(state); modal(`<div class="modalhead"><div><h2>העלאת ${kind}</h2><p class="muted">הקובץ ישויך אוטומטית אל ${esc(p.name)}</p></div><button class="close">×</button></div><div class="dropzone"><div style="font-size:34px">⇧</div><strong>גרירה או בחירת קובץ</strong><p class="muted tiny">PDF, תמונה, Word או Excel</p><input type="file" id="fileInput" style="margin-top:10px"></div><div class="modal-actions"><button class="primary" id="mockUpload">העלאת קובץ לדוגמה</button></div>`); $('#mockUpload').onclick=()=>{p.files.unshift({name:kind==='תמונה'?'תמונה חדשה מהשטח.jpg':'חוזה פרויקט.pdf',type:kind,date:'היום'});closeModal();state.activeProjectTab='files';render();toast('הקובץ נוסף לתיק הפרויקט')}; }
  function newProjectModal(){ modal(`<div class="modalhead"><div><h2>פתיחת פרויקט</h2><p class="muted">העלאת חוזה יכולה למלא את רוב הפרטים אוטומטית.</p></div><button class="close">×</button></div><div class="dropzone"><div style="font-size:30px">▤</div><strong>העלאת חוזה או הצעת מחיר</strong><p class="tiny muted">בדמו יוצגו נתונים שחולצו אוטומטית</p><button class="secondary" id="extractContract">הדגמת חילוץ</button></div><div class="field"><label>שם פרויקט</label><input id="npName" placeholder="שם הלקוח / הפרויקט"></div><div class="field"><label>כתובת</label><input id="npLoc" placeholder="יישוב"></div><div class="field"><label>סכום הצעה</label><input id="npContract" type="number" placeholder="₪"></div><div class="modal-actions"><button class="primary" id="saveProject">יצירת פרויקט</button></div>`); $('#extractContract').onclick=()=>{$('#npName').value='גינת משפחת ברק';$('#npLoc').value='מיתר';$('#npContract').value='124000';toast('הפרטים חולצו מהמסמך — נדרש רק אישור')}; $('#saveProject').onclick=()=>{toast('בדמו נשמרה טיוטת פרויקט חדשה');closeModal()}; }
  function bind(){
    $$('[data-go]').forEach(b=>b.onclick=()=>setView(b.dataset.go));
    $$('[data-project]').forEach(el=>{el.onclick=()=>openProject(el.dataset.project);el.onkeydown=e=>{if(e.key==='Enter')openProject(el.dataset.project)}});
    $$('.alert').forEach(el=>el.onclick=()=>openProject(el.dataset.project,el.dataset.target||'overview'));
    $$('[data-open-alert]').forEach(el=>el.onclick=()=>openProject(el.dataset.openAlert,'execution'));
    $$('[data-ptab]').forEach(b=>b.onclick=()=>{state.activeProjectTab=b.dataset.ptab;render()});
    const np=$('#pageNewProject');if(np)np.onclick=newProjectModal;
    const cp=$('#copyWeekly');if(cp)cp.onclick=()=>toast('הסיכום הועתק — מוכן לשיתוף');
    ['projectRecord','logUpdate'].forEach(id=>{const b=$('#'+id);if(b)b.onclick=()=>updateModal(state.currentProjectId)});
    ['projectPhotos','filesPhotos'].forEach(id=>{const b=$('#'+id);if(b)b.onclick=()=>fileModal('תמונה')});
    ['projectFile','filesUpload'].forEach(id=>{const b=$('#'+id);if(b)b.onclick=()=>fileModal('מסמך')});
    const ae=$('#addExtra');if(ae)ae.onclick=()=>updateModal(state.currentProjectId);
    $$('.check').forEach((b,i)=>b.onclick=()=>{const p=C.getProject(state);if(p.tasks[i])p.tasks[i].done=!p.tasks[i].done;render();toast('המשימה עודכנה')});
  }
  $$('.navbtn').forEach(b=>b.onclick=()=>setView(b.dataset.view));
  $('#globalUpdateBtn').onclick=()=>updateModal(null);$('#newProjectBtn').onclick=newProjectModal;
  $('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');state.theme=document.body.classList.contains('dark')?'dark':'light';$('#themeBtn').textContent=state.theme==='dark'?'☀':'☾'};
  function sendQuestion(q){ if(!q.trim())return; const chat=$('#chat');chat.insertAdjacentHTML('beforeend',`<div class="bubble user">${esc(q)}</div>`);const ans=C.answerAgent(state,q);setTimeout(()=>{chat.insertAdjacentHTML('beforeend',`<div class="bubble bot">${esc(ans)}</div>`);chat.scrollTop=chat.scrollHeight},180);chat.scrollTop=chat.scrollHeight; }
  $('#chatForm').onsubmit=e=>{e.preventDefault();const i=$('#chatInput');sendQuestion(i.value);i.value=''};$$('.suggestion').forEach(b=>b.onclick=()=>sendQuestion(b.textContent));
  window.__GENS_DEMO__={state,render,setView,openProject,updateModal,sendQuestion};
  render();
})();
</script>
</body>
</html>
